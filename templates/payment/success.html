<!DOCTYPE html>
<html>
<head>
    <title>Thanh toán thành công</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 40px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .success-icon {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .highlight {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">🎉</div>
        <h1>{{.Heading}}</h1>
        <p>{{.Message}}</p>
        <div class="highlight">
            <p><strong>Mã đơn hàng:</strong> {{.OrderID}}</p>
            {{if .TicketID}}<p><strong>Mã vé:</strong> #{{.TicketID}}</p>{{end}}
            <p><strong>Trạng thái:</strong> ✅ Đã thanh toán</p>
        </div>
        <p>{{.SubMessage}}</p>
        <button onclick="closeWindow()">Đóng trang này</button>
    </div>
    <script>
        function closeWindow() {
            window.close();
        }
        setTimeout(() => {
            window.close();
        }, 8000);
    </script>
</body>
</html>
